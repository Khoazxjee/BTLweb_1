name: Build, test and package hotel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: cmd

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore AuroraHotel.sln
      - run: dotnet build AuroraHotel.sln -c Release --no-restore
      - run: dotnet test AuroraHotel.sln -c Release --no-build --logger "trx;LogFileName=hotel-tests.trx" --results-directory TestResults
      - name: Package for Windows IIS hosting
        run: dotnet publish src/AuroraHotel -c Release -r win-x86 --self-contained false -p:EnvironmentName=Production -p:DebugType=None -p:DebugSymbols=false -o artifacts/hosting
      - uses: actions/upload-artifact@v4
        with:
          name: AuroraHotel-hosting
          path: artifacts/hosting/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-results
          path: TestResults/*.trx
          retention-days: 7
